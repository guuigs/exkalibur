<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Georgia, serif">
  <rect width="900" height="640" fill="#1a1a2e"/>
  <text x="450" y="30" fill="#e0e0e0" font-size="20" text-anchor="middle" font-weight="bold">Plan reconstitué — Enluminure 9 (T13-H) : la carte de la zone finale</text>
  <text x="450" y="52" fill="#9aa" font-size="12" text-anchor="middle">Positions relatives en % (photo e9_rot.jpg 2048×1536). Reconstruit par segmentation couleur + description — vision LLM indisponible.</text>

  <!-- CIEL (haut) : nuit + lueur rose aube -->
  <rect x="60" y="70" width="780" height="150" fill="#2a1f35"/>
  <text x="450" y="88" fill="#f0c0c8" font-size="13" text-anchor="middle">CIEL NOCTURNE + lueur rose d'aube (est = gauche)</text>
  <circle cx="150" cy="140" r="30" fill="#e8a0b0" opacity="0.5"/>
  <text x="150" y="118" fill="#fff" font-size="11" text-anchor="middle">aube</text>
  <!-- loup + glyphe -->
  <text x="300" y="150" fill="#d0d0d0" font-size="12">loup + glyphe «V♀» + étoile + arc-en-ciel</text>

  <!-- HORIZON : montagnes + château + ville à arcades -->
  <rect x="60" y="220" width="780" height="90" fill="#3a2f3f"/>
  <polygon points="60,310 180,235 300,310" fill="#4a3f50"/>
  <polygon points="600,310 720,240 840,310" fill="#4a3f50"/>
  <text x="450" y="300" fill="#e88" font-size="12" text-anchor="middle">MONTAGNES — CHÂTEAU SUR BUTTE — VILLE À ARCADE(S)/AQUEDUC (toits rouges)</text>

  <!-- ÉTANG -->
  <ellipse cx="450" cy="380" rx="170" ry="45" fill="#2b5fa0" stroke="#1a3a66" stroke-width="3"/>
  <text x="450" y="384" fill="#fff" font-size="13" text-anchor="middle">ÉTANG bleu «en haricot» (2 poissons dorés + 2 cygnes)</text>
  <circle cx="380" cy="380" r="6" fill="#e0b040"/><circle cx="410" cy="390" r="6" fill="#e0b040"/>
  <circle cx="520" cy="378" r="7" fill="#f0f0f0"/><circle cx="545" cy="390" r="7" fill="#f0f0f0"/>

  <!-- ROCHER + COUPE + RUISSEAU -->
  <polygon points="300,470 340,420 400,425 360,475" fill="#ccc" stroke="#888"/>
  <text x="355" y="460" fill="#333" font-size="10" text-anchor="middle">rocher</text>
  <line x1="352" y1="440" x2="352" y2="462" stroke="#222" stroke-width="3"/>
  <text x="380" y="500" fill="#fff" font-size="11" text-anchor="start">«coupe du charpentier» (fente du rocher)</text>
  <path d="M352,440 C 360,430 365,415 358,400" stroke="#8fc4ff" stroke-width="4" fill="none"/>
  <text x="340" y="415" fill="#8fc4ff" font-size="10" text-anchor="end">ruisseau/cascade</text>

  <!-- ARBRE -->
  <rect x="600" y="430" width="10" height="60" fill="#5a3a20"/>
  <circle cx="605" cy="420" r="38" fill="#3a6a30"/>
  <circle cx="585" cy="410" r="6" fill="#e8b020"/><circle cx="620" cy="402" r="6" fill="#e8b020"/><circle cx="610" cy="425" r="6" fill="#e8b020"/>
  <text x="605" y="510" fill="#fff" font-size="11" text-anchor="middle">grand arbre à fruits dorés («souche-majesté»)</text>

  <!-- SOLDAT -->
  <circle cx="250" cy="520" r="16" fill="#c0392b"/><text x="250" y="524" fill="#fff" font-size="10" text-anchor="middle">casque</text>
  <rect x="232" y="536" width="36" height="55" fill="#a03020"/>
  <circle cx="250" cy="560" r="7" fill="#e0b040" stroke="#a08000"/>
  <text x="250" y="610" fill="#fff" font-size="11" text-anchor="middle">SOLDAT ROMAIN (crinière/cape rouge, anneau doré)</text>
  <circle cx="215" cy="600" r="9" fill="#9aa" stroke="#666"/><text x="215" y="622" fill="#999" font-size="9" text-anchor="middle">crâne gris</text>

  <!-- LEGENDE géométrie -->
  <g font-size="11" fill="#ccc">
    <text x="700" y="560">Géométrie déduite (texte É12) :</text>
    <text x="700" y="576">clairière → «eaux enchantées» (senestre) → roche</text>
    <text x="700" y="590">roche → 10 pas N + 10 pas E (≈14 pas @45°) → souche</text>
    <text x="700" y="604">souche → 8 pas (azimut «jour dernier» 30/04) → coupe</text>
    <text x="700" y="618">étang = marqueur de zone (contour exploitable, FAQ03-308)</text>
  </g>
</svg>
